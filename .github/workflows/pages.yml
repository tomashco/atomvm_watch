name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: cat versions.env >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v31
      - run: nix profile install nixpkgs#devenv
      - name: Build the site
        run: devenv shell -- bash -c 'setup && scripts/build-m5-emu.sh && cd web && pnpm build'
      # Release downloads send no CORS headers, which COEP (require-corp) needs, so the firmware
      # releases listed in firmware/m5stickc_plus2/runtimes.json are mirrored into the site.
      - name: Mirror the firmware releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/mirror-firmware.sh m5stickc_plus2 web/dist/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke the deployment
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.page_url }}"
          # New files can 404 for a short while after deploy-pages returns, until the CDN catches up.
          check() {
            for _ in $(seq 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$1" || true); echo "$code $1"
              [ "$code" = 200 ] && return 0
              sleep 10
            done
            return 1
          }
          check "$url"
          check "${url}fixtures/clock.avm"
          curl -fsSI "${url}atomvm/AtomVM.wasm" | grep -i 'content-type: application/wasm'
          check "${url}firmware/manifest-m5stickc_plus2.json"
          check "${url}firmware/runtimes-m5stickc_plus2.json"
          check "${url}fixtures/examples.json"
