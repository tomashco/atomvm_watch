name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: cat versions.env >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v31
      - run: nix profile install nixpkgs#devenv
      - name: Build the site
        run: devenv shell -- bash -c 'setup && scripts/build-m5-emu.sh && cd web && pnpm build'
      # Release downloads send no CORS headers, which COEP (require-corp) needs, so the latest
      # firmware release is mirrored into the site and served same-origin.
      - name: Mirror the latest firmware release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web/dist/firmware
          # Only "no release yet" is a warning; any other gh error (rate limit, auth, network, a
          # missing asset in an existing release) fails the job.
          if ! err=$(gh release view --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null); then
            if grep -qi 'release not found' <<<"$err"; then
              echo "::warning::No release exists yet; deploying without firmware (Install runtime will not work)"
              exit 0
            fi
            echo "gh release view failed: $err" >&2
            exit 1
          fi
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'manifest-m5stickc_plus2.json' --dir web/dist/firmware --clobber
          test -f web/dist/firmware/manifest-m5stickc_plus2.json \
            || { echo "latest release has no manifest-m5stickc_plus2.json" >&2; exit 1; }
          img=$(python3 -c 'import json;print(json.load(open("web/dist/firmware/manifest-m5stickc_plus2.json"))["parts"][0]["path"])')
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$img" --dir web/dist/firmware --clobber
          test -f "web/dist/firmware/$img"
          ls -l web/dist/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke the deployment
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.page_url }}"
          check() { code=$(curl -sS -o /dev/null -w '%{http_code}' "$1"); echo "$code $1"; [ "$code" = 200 ]; }
          check "$url"
          check "${url}fixtures/clock.avm"
          curl -fsSI "${url}atomvm/AtomVM.wasm" | grep -i 'content-type: application/wasm'
          if [ -f web/dist/firmware/manifest-m5stickc_plus2.json ]; then
            check "${url}firmware/manifest-m5stickc_plus2.json"
          fi
